# Reusable workflow: the test/lint jobs (audit, python-checks, rust-checks, unit,
# integration) plus the test-result GCS upload. Invoked by build-test-deploy.yml.
# Test/cron images are published by build-and-push-test-images.yml; service images
# by mozcloud-publish.yaml.
name: check-and-test

on:
  workflow_call: {}

permissions:
  contents: read

env:
  # NOTE: keep in sync with Dockerfile / Makefile  # RUST_VER
  RUST_VERSION: "1.96"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache cargo-audit
        id: cache-cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.RUST_VERSION }}
      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit
      - name: cargo audit
        run: cargo audit

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang
      - name: Install poetry
        run: |
          pip install --upgrade pip
          pip install poetry==2.0.0
      - name: isort, black, flake8, bandit, pydocstyle and mypy
        run: make lint

  rust-checks:
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
      RUST_TEST_THREADS: 1
      BIGTABLE_EMULATOR_HOST: localhost:8086
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake libssl-dev pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Echo Rust version
        run: rustc --version
      - name: Check formatting and clippy
        run: |
          cargo fmt -- --check
          cargo clippy --all --all-targets --all-features -- -D warnings -A deprecated --deny=clippy::dbg_macro

  test-unit:
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
      RUST_TEST_THREADS: 1
      BIGTABLE_EMULATOR_HOST: localhost:8086
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Create test result workspace
        run: mkdir -p workspace/test-results
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake libssl-dev pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Start Bigtable emulator
        # Waits until emulator starts and is bootstrapped; emulator required for tests
        run: docker compose -f docker-compose-bigtable.yml run --rm bigtable-setup
      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - name: Install cargo-llvm-cov
        # Download the prebuilt binary (like cargo-nextest above) instead of
        # `cargo install`, which compiles it from source (~1-2 min) every run.
        run: |
          curl -LsSf https://github.com/taiki-e/cargo-llvm-cov/releases/latest/download/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz \
            | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - name: Echo Rust version
        run: rustc --version
      # NOTE: This build can exceed the memory available on a standard runner. The
      # Makefile target limits cargo to --jobs=2 to reduce OOM risk;
      # a larger runner may be needed if this OOMs.
      - name: Unit tests
        run: make unit-test
      - name: Store test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: workspace/test-results

  # Redis is a mutually exclusive build with Bigtable, so it gets its own job
  # rather than another feature flag on `test-unit`.
  test-unit-redis:
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
      # The Redis-backed tests share one keyspace; run them serially.
      RUST_TEST_THREADS: 1
      REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Create test result workspace
        run: mkdir -p workspace/test-results
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake libssl-dev pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      # Started via `docker run` rather than a `services:` block so the Docker Hub
      # login above applies: service containers are pulled before any step runs.
      - name: Start Redis
        run: |
          docker run -d --name autopush-redis -p 6379:6379 redis:8 \
            redis-server --save "" --appendonly no
          for _ in $(seq 30); do
            docker exec autopush-redis redis-cli ping && exit 0
            sleep 1
          done
          echo "Redis did not become ready" >&2
          exit 1
      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - name: Echo Rust version
        run: rustc --version
      - name: Unit tests (Redis)
        run: make unit-test-redis
      - name: Store test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-redis-test-results
          path: workspace/test-results

  test-integration:
    runs-on: ubuntu-latest
    needs:
      - python-checks
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Create test result workspace
        run: mkdir -p workspace/test-results
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Integration tests
        run: |
          docker compose -f tests/integration/docker-compose.yml run -i --name integration-tests tests; exit_code=$?
          docker cp integration-tests:/code/integration__results.xml workspace/test-results/integration__results.xml
          exit $exit_code
      - name: Store test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: workspace/test-results

  # Same suite as `test-integration`, but the services are built against Redis
  # instead of the Bigtable emulator.
  test-integration-redis:
    runs-on: ubuntu-latest
    needs:
      - python-checks
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Create test result workspace
        run: mkdir -p workspace/test-results
      - name: Log in to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Integration tests (Redis)
        run: |
          docker compose -f tests/integration/docker-compose-redis.yml run -i --name integration-tests-redis tests; exit_code=$?
          docker cp integration-tests-redis:/code/integration__results.xml workspace/test-results/integration-redis__results.xml
          exit $exit_code
      - name: Store test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-redis-test-results
          path: workspace/test-results
